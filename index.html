<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>制服在庫管理システム</title>
<style>
  :root{
    --navy:#1c3a56;
    --navy-dark:#122840;
    --amber:#c07a1e;
    --green:#2f7a4f;
    --red:#b23a3a;
    --bg:#f6f4ee;
    --card:#ffffff;
    --border:#e2ded2;
    --text:#23262b;
    --text-soft:#6c7079;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Sans","Yu Gothic",Meiryo,Roboto,Arial,sans-serif;
    padding-bottom:60px;
  }
  header{
    background:var(--navy);
    background-image:repeating-linear-gradient(0deg,rgba(255,255,255,.03) 0px,rgba(255,255,255,.03) 1px,transparent 1px,transparent 4px);
    color:#fff;
    padding:18px 16px 14px;
  }
  header h1{margin:0;font-size:1.5rem;font-weight:700;letter-spacing:.02em;}
  header h2{margin:2px 0 0;font-size:.85rem;font-weight:400;color:#c9d6e3;}
  .barra-status{
    display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;
    margin-top:12px;font-size:.82rem;color:#dbe4ee;
  }
  .ponto{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:5px;background:#8a97a4;}
  .ponto.ok{background:#5fbf7e;}
  .ponto.erro{background:#e06a6a;}
  .barra-status button, .usuario-atual button{
    background:none;border:1px solid rgba(255,255,255,.4);color:#fff;
    border-radius:5px;padding:3px 9px;font-size:.78rem;cursor:pointer;
  }
  .barra-status button:hover{background:rgba(255,255,255,.12);}
  .seletor-modo, .seletor-idioma{display:flex;gap:4px;}
  .seletor-modo button.ativo, .seletor-idioma button.ativo{background:#fff;color:var(--navy);border-color:#fff;font-weight:700;}

  .aviso-versao{
    display:none;background:#fdf0dc;color:#7a4a05;padding:10px 16px;font-size:.84rem;
    border-bottom:1px solid #e9cf9f;text-align:center;line-height:1.5;
  }
  .aviso-versao.visivel{display:block;}

  .container{max-width:1300px;margin:0 auto;padding:0 16px;}

  .painel-controle{
    display:flex;flex-wrap:wrap;gap:10px;align-items:center;
    margin-top:18px;position:sticky;top:0;background:var(--bg);padding:10px 0;z-index:5;
  }
  .abas{display:flex;flex-wrap:wrap;gap:6px;}
  .aba{
    border:1px solid var(--border);background:#fff;color:var(--text-soft);
    padding:7px 14px;border-radius:20px;font-size:.85rem;cursor:pointer;font-weight:600;
  }
  .aba.ativa{background:var(--navy);border-color:var(--navy);color:#fff;}
  #busca{
    flex:1;min-width:150px;padding:8px 12px;border:1px solid var(--border);
    border-radius:20px;font-size:.9rem;
  }
  .btn-barra{
    border:1px solid var(--border);background:#fff;padding:8px 14px;border-radius:20px;
    font-size:.85rem;cursor:pointer;font-weight:600;color:var(--navy);position:relative;
  }
  .btn-barra.destaque{background:var(--navy);color:#fff;border-color:var(--navy);}
  .badge-pendentes{
    background:var(--red);color:#fff;border-radius:999px;font-size:.68rem;font-weight:700;
    padding:1px 6px;margin-left:4px;
  }

  /* ---------- cartões dos produtos ---------- */
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px;margin-top:6px;}

  .card{
    background:var(--card);border:1px solid var(--border);border-radius:10px;
    overflow:hidden;display:flex;flex-direction:column;
  }
  .card-cabecalho{
    cursor:pointer;display:flex;flex-direction:column;
    -webkit-tap-highlight-color:transparent;
  }
  .card-cabecalho:hover .card-imagem{filter:brightness(0.97);}
  .card-imagem{
    height:190px;background:#fafaf7;display:flex;align-items:center;justify-content:center;
    border-bottom:1px solid var(--border);position:relative;
  }
  .card-imagem img{max-width:100%;max-height:100%;object-fit:contain;}
  .sem-imagem{color:#b7b2a4;font-size:.8rem;font-style:italic;padding:0 10px;text-align:center;}
  .card-titulo-area{padding:10px 14px 8px;}
  .card-topo{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;}
  .titulo-principal{font-weight:700;font-size:1.15rem;line-height:1.3;}
  .titulo-secundario{font-size:.8rem;color:var(--text-soft);margin-top:1px;}
  .total-produto{
    font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:.78rem;
    background:#eef2f6;color:var(--navy);border-radius:6px;padding:3px 7px;white-space:nowrap;
  }
  .preco{font-size:.8rem;color:var(--green);font-weight:600;margin:6px 0 0;}
  .dica-toque{
    font-size:.74rem;color:var(--text-soft);margin-top:6px;display:flex;align-items:center;gap:4px;
  }
  .dica-toque .seta{transition:transform .2s ease;display:inline-block;}
  .card.aberto .dica-toque .seta{transform:rotate(180deg);}

  .card-detalhe{
    max-height:0;overflow:hidden;transition:max-height .25s ease;
    padding:0 14px;border-top:1px solid transparent;
  }
  .card.aberto .card-detalhe{max-height:900px;border-top:1px solid var(--border);padding:8px 14px 14px;}

  .cabecalho-tamanhos{
    display:flex;align-items:center;font-size:.68rem;color:var(--text-soft);
    font-weight:700;text-transform:uppercase;letter-spacing:.03em;
    border-bottom:2px solid var(--border);padding-bottom:4px;
  }
  .cabecalho-tamanhos .col-tamanho{flex:0 0 52px;}
  .cabecalho-tamanhos .col-estoque{flex:0 0 56px;text-align:center;}
  .cabecalho-tamanhos .col-ajuste{flex:1;text-align:right;}
  .linha-tamanho{
    display:flex;align-items:center;
    padding:7px 0;border-bottom:1px dashed #ece9df;
  }
  .linha-tamanho:last-child{border-bottom:none;}

  /* Sem estoque (0) = vermelho | Estoque baixo = laranja | Estoque ok = verde */
  .linha-tamanho.sem-estoque .valor-estoque{color:var(--red);}
  .linha-tamanho.sem-estoque .etiqueta-tamanho{box-shadow:inset 0 0 0 1.5px var(--red);}
  .linha-tamanho.estoque-baixo .valor-estoque{color:var(--amber);}
  .linha-tamanho.estoque-baixo .etiqueta-tamanho{box-shadow:inset 0 0 0 1.5px var(--amber);}
  .linha-tamanho.estoque-ok .valor-estoque{color:var(--green);}
  .linha-tamanho.estoque-ok .etiqueta-tamanho{box-shadow:inset 0 0 0 1.5px var(--green);}

  .etiqueta-tamanho{
    position:relative;font-weight:700;font-size:.8rem;background:#eef1f5;color:var(--navy);
    padding:3px 9px 3px 14px;border-radius:3px;text-align:center;
    flex:0 0 52px;
  }
  .etiqueta-tamanho::before{
    content:"";position:absolute;left:5px;top:50%;transform:translateY(-50%);
    width:4px;height:4px;border-radius:50%;background:#fff;box-shadow:0 0 0 1px var(--navy);
  }

  .valor-estoque-col{flex:0 0 56px;text-align:center;}
  .controles{display:flex;align-items:center;gap:5px;flex:1;justify-content:flex-end;}
  .valor-estoque{
    font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-weight:700;font-size:1rem;
    min-width:30px;text-align:center;cursor:pointer;border-radius:4px;padding:2px 4px;
  }
  .valor-estoque:hover{background:#f1eee3;}
  .valor-estoque input{
    width:48px;font-family:inherit;font-size:1rem;font-weight:700;text-align:center;
    border:1px solid var(--navy);border-radius:4px;padding:1px;
  }
  .input-passo{
    width:38px;text-align:center;font-family:inherit;font-size:.82rem;
    border:1px solid var(--border);border-radius:5px;padding:4px 2px;
    -moz-appearance:textfield;
  }
  .input-passo::-webkit-inner-spin-button, .input-passo::-webkit-outer-spin-button{
    -webkit-appearance:none;margin:0;
  }
  .btn-passo{
    width:28px;height:28px;border:none;border-radius:6px;color:#fff;font-size:1rem;
    font-weight:700;cursor:pointer;line-height:1;flex-shrink:0;
  }
  .btn-passo:disabled{background:#cfcac0 !important;cursor:not-allowed;}
  .btn-mais{background:var(--green);}
  .btn-menos{background:var(--red);}

  .oculto{display:none !important;}

  /* ---- Modo de visualização forçado (Auto / PC / Celular) ---- */
  body.modo-pc .grid{grid-template-columns:repeat(auto-fit,minmax(260px,1fr));}
  body.modo-pc .card-imagem{height:190px;}
  body.modo-pc .painel-controle{flex-wrap:nowrap;}

  body.modo-celular{max-width:480px;margin:0 auto;}
  body.modo-celular .grid{grid-template-columns:1fr;}
  body.modo-celular .card-imagem{height:150px;}
  body.modo-celular .painel-controle{flex-direction:column;align-items:stretch;}
  body.modo-celular #busca{width:100%;min-width:0;}
  body.modo-celular .abas{justify-content:center;}

  /* ---------- painéis laterais (histórico e pedidos) ---------- */
  .painel-lateral{
    position:fixed;top:0;right:0;height:100%;width:min(360px,100%);
    background:#fff;box-shadow:-4px 0 18px rgba(0,0,0,.15);
    transform:translateX(100%);transition:transform .25s ease;z-index:20;
    display:flex;flex-direction:column;
  }
  #painelPedidos{width:min(430px,100%);}
  .painel-lateral.aberto{transform:translateX(0);}
  .painel-lateral-topo{
    padding:14px 16px;border-bottom:1px solid var(--border);
    display:flex;justify-content:space-between;align-items:center;
  }
  .painel-lateral-topo h3{margin:0;font-size:1rem;}
  .painel-lateral-topo button{border:none;background:none;font-size:1.3rem;cursor:pointer;color:var(--text-soft);}
  .lista-historico, .lista-pedidos{overflow-y:auto;padding:8px 16px;flex:1;}
  .item-historico{padding:9px 0;border-bottom:1px solid #f0eee6;font-size:.85rem;}
  .item-historico .quando{color:var(--text-soft);font-size:.75rem;}
  .fundo-escurecido{
    position:fixed;inset:0;background:rgba(0,0,0,.25);z-index:19;opacity:0;pointer-events:none;transition:opacity .2s;
  }
  .fundo-escurecido.ativo{opacity:1;pointer-events:auto;}

  /* ---------- pedidos ---------- */
  .pedido{
    border:1px solid var(--border);border-radius:10px;padding:10px 12px;margin-bottom:12px;background:#fff;
  }
  .pedido-cabecalho{border-bottom:1px dashed var(--border);padding-bottom:8px;margin-bottom:6px;}
  .pedido-funcionario{font-weight:700;font-size:.98rem;}
  .pedido-sub{font-size:.76rem;color:var(--text-soft);margin-top:2px;}
  .pedido-em-lote{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:8px;}
  .pedido-em-lote .rotulo-lote{font-size:.74rem;font-weight:700;color:var(--text-soft);}
  .pedido-item{padding:8px 0;border-bottom:1px dotted #ece9df;}
  .pedido-item:last-child{border-bottom:none;padding-bottom:0;}
  .pedido-item-topo{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;}
  .pedido-item-nome{font-weight:600;font-size:.88rem;}
  .status-badge{
    font-size:.68rem;font-weight:700;border-radius:999px;padding:2px 9px;white-space:nowrap;
  }
  .status-badge.pendente{background:#fdf0dc;color:var(--amber);}
  .status-badge.atendido{background:#e3f3e9;color:var(--green);}
  .status-badge.fabrica{background:#e4edf5;color:var(--navy);}
  .status-badge.cancelado{background:#f1eee3;color:var(--text-soft);}
  .pedido-acoes{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap;}
  .pedido-acoes button, .pedido-em-lote button{
    flex:1;min-width:84px;border:none;border-radius:6px;padding:7px 6px;font-size:.76rem;
    font-weight:700;cursor:pointer;color:#fff;
  }
  .pedido-acoes button:disabled, .pedido-em-lote button:disabled{opacity:.5;cursor:not-allowed;}
  .btn-atendido{background:var(--green);}
  .btn-fabrica{background:var(--navy);}
  .btn-cancelar-pedido{background:var(--red);}
  .subtitulo-lista{margin:14px 0 8px;font-size:.82rem;color:var(--text-soft);}

  /* ---------- janelas (nome, pedido, relatório) ---------- */
  .modal-nome{
    position:fixed;top:50%;left:50%;transform:translate(-50%,-50%) scale(.95);
    background:#fff;border-radius:14px;box-shadow:0 10px 40px rgba(0,0,0,.25);
    width:min(360px,90vw);padding:22px 20px;z-index:31;
    opacity:0;pointer-events:none;transition:opacity .2s, transform .2s;
  }
  .modal-nome.aberto{opacity:1;pointer-events:auto;transform:translate(-50%,-50%) scale(1);}
  .modal-nome h3{margin:0 0 2px;font-size:1.15rem;color:var(--navy);}
  .modal-nome-sub{margin:0 0 10px;font-size:.82rem;color:var(--text-soft);}
  .modal-nome-explicacao{margin:0 0 14px;font-size:.82rem;color:var(--text-soft);line-height:1.4;}
  #inputNomeUsuario{
    width:100%;padding:12px 14px;font-size:1.05rem;border:2px solid var(--border);
    border-radius:8px;box-sizing:border-box;
  }
  #inputNomeUsuario:focus{outline:none;border-color:var(--navy);}
  #inputNomeUsuario.campo-invalido{border-color:var(--red);}
  .modal-nome-erro{
    display:none;color:var(--red);font-size:.82rem;margin-top:8px;font-weight:600;
  }
  .modal-nome-erro.visivel{display:block;}
  .modal-nome-botoes{display:flex;justify-content:flex-end;gap:8px;margin-top:18px;}
  .btn-modal-primario, .btn-modal-secundario{
    padding:10px 18px;border-radius:8px;font-size:.9rem;font-weight:700;cursor:pointer;border:none;
  }
  .btn-modal-primario{background:var(--navy);color:#fff;}
  .btn-modal-primario:disabled{opacity:.6;cursor:not-allowed;}
  .btn-modal-secundario{background:#f1eee3;color:var(--text);}
  #fundoNome{z-index:30;}
  .modal-grande{max-height:88vh;overflow-y:auto;}

  .rotulo-campo{display:block;font-size:.76rem;font-weight:700;color:var(--text-soft);margin:12px 0 4px;}
  .modal-nome select, .modal-nome input[type="text"], .modal-nome input[type="number"]{
    width:100%;padding:10px 12px;font-size:.95rem;border:2px solid var(--border);
    border-radius:8px;box-sizing:border-box;font-family:inherit;background:#fff;
  }
  .modal-nome select:focus, .modal-nome input:focus{outline:none;border-color:var(--navy);}

  /* pedido com vários itens */
  .modal-solicitar{width:min(480px,94vw);}
  .linha-item-solicitar{
    display:grid;grid-template-columns:1fr 76px 38px;gap:6px;align-items:center;
    border:1px solid var(--border);border-radius:10px;padding:10px;margin-bottom:10px;background:#faf9f5;
  }
  .linha-item-solicitar .sel-produto{grid-column:1 / -1;}
  .btn-remover-item{
    width:38px;height:38px;border:none;border-radius:8px;background:#f1eee3;color:var(--red);
    font-size:1rem;font-weight:700;cursor:pointer;
  }
  .btn-remover-item:disabled{opacity:.35;cursor:not-allowed;}
  .btn-adicionar-item{
    width:100%;border:2px dashed var(--border);background:#fff;color:var(--navy);
    border-radius:10px;padding:10px;font-size:.9rem;font-weight:700;cursor:pointer;
  }
  .btn-adicionar-item:hover{border-color:var(--navy);}
  .resumo-solicitar{font-size:.82rem;color:var(--text-soft);margin:10px 0 0;text-align:right;}

  /* relatório */
  .modal-relatorio{width:min(1000px,96vw);}
  .rel-topo{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;}
  .rel-topo button{border:none;background:none;font-size:1.4rem;cursor:pointer;color:var(--text-soft);}
  .rel-filtros{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:flex-end;margin:12px 0 4px;}
  .rel-grupo{display:flex;flex-direction:column;}
  .rel-grupo .rotulo-campo{margin:0 0 4px;}
  .rel-grupo select{width:auto !important;min-width:96px;padding:8px 10px !important;}
  .rel-modos{display:flex;gap:4px;}
  .rel-modos button{
    border:1px solid var(--border);background:#fff;color:var(--text-soft);padding:8px 16px;
    border-radius:20px;font-size:.85rem;font-weight:700;cursor:pointer;
  }
  .rel-modos button.ativo{background:var(--navy);border-color:var(--navy);color:#fff;}
  .btn-csv{
    margin-left:auto;border:1px solid var(--border);background:#fff;color:var(--navy);
    padding:8px 14px;border-radius:20px;font-size:.85rem;font-weight:700;cursor:pointer;
  }
  .rel-cards{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0;}
  .rel-card{border:1px solid var(--border);border-radius:10px;padding:10px 14px;background:#faf9f5;}
  .rel-card .rotulo{font-size:.76rem;font-weight:700;color:var(--text-soft);}
  .rel-card .numero{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:1.7rem;font-weight:700;margin-top:2px;}
  .rel-card .sub{font-size:.72rem;color:var(--text-soft);margin-top:2px;}
  .pos{color:var(--green);}
  .neg{color:var(--red);}
  .neutro{color:var(--navy);}
  .rel-secao{margin:18px 0 6px;font-size:.92rem;font-weight:700;color:var(--navy);}
  .rel-rolagem{overflow-x:auto;border:1px solid var(--border);border-radius:10px;}
  .rel-tabela{width:100%;border-collapse:collapse;font-size:.84rem;min-width:560px;}
  .rel-tabela th{
    text-align:left;font-size:.72rem;color:var(--text-soft);text-transform:uppercase;letter-spacing:.03em;
    background:#faf9f5;padding:8px 10px;border-bottom:2px solid var(--border);white-space:nowrap;
  }
  .rel-tabela td{padding:7px 10px;border-bottom:1px solid #f0eee6;vertical-align:top;}
  .rel-tabela tr:last-child td{border-bottom:none;}
  .rel-tabela .num{text-align:right;font-family:ui-monospace,SFMono-Regular,Consolas,monospace;white-space:nowrap;}
  .rel-tabela th.num{text-align:right;}
  .rel-tabela .linha-produto td{font-weight:700;background:#fcfbf8;}
  .rel-tabela .linha-tam td{color:var(--text-soft);font-size:.8rem;padding-top:4px;padding-bottom:4px;}
  .rel-tabela .linha-tam td:first-child{padding-left:26px;}
  .rel-tabela .linha-total td{font-weight:700;background:#faf9f5;border-top:2px solid var(--border);}
  .rel-nota{font-size:.74rem;color:var(--text-soft);margin-top:14px;line-height:1.5;}
  .rel-vazio{padding:22px;text-align:center;color:var(--text-soft);}

  .toast{
    position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);background:var(--navy-dark);color:#fff;
    padding:10px 18px;border-radius:999px;font-size:.88rem;opacity:0;pointer-events:none;
    transition:opacity .25s, transform .25s;z-index:40;max-width:92vw;text-align:center;
  }
  .toast.visivel{opacity:1;transform:translate(-50%,0);}

  @media (max-width:480px){
    .card-imagem{height:150px;}
    .rel-cards{grid-template-columns:1fr;}
    .btn-csv{margin-left:0;}
  }
</style>
</head>
<body>

<header>
  <h1 id="tituloPagina">制服在庫管理システム</h1>
  <h2 id="subtituloPagina"></h2>
  <div class="barra-status">
    <span><span class="ponto" id="pontoStatus"></span><span id="textoStatus"></span></span>
    <span class="usuario-atual"><span data-i18n="usuario"></span>: <strong id="nomeUsuarioAtual">—</strong> <button id="btnTrocarNome" data-i18n="trocar"></button></span>
    <span class="seletor-idioma" id="seletorIdioma">
      <button data-idioma="ja">日本語</button>
      <button data-idioma="pt">Português</button>
    </span>
    <span class="seletor-modo" id="seletorModo">
      <button data-modo="auto" data-i18n="modoAuto"></button>
      <button data-modo="pc" data-i18n="modoPc"></button>
      <button data-modo="celular" data-i18n="modoCelular"></button>
    </span>
  </div>
</header>
<div class="aviso-versao" id="avisoVersao" role="alert"></div>

<div class="container">
  <div class="painel-controle">
    <div class="abas" id="abas"></div>
    <input type="text" id="busca" data-i18n-ph="buscaPh" data-i18n-title="buscaTitulo">
    <button class="btn-barra destaque" id="btnSolicitar" data-i18n="btnSolicitar" data-i18n-title="btnSolicitarTitulo"></button>
    <button class="btn-barra" id="btnPendentes" data-i18n-title="btnPedidosTitulo"><span data-i18n="btnPedidos"></span><span class="badge-pendentes" id="badgePendentes" style="display:none;">0</span></button>
    <button class="btn-barra" id="btnRelatorio" data-i18n="btnRelatorio" data-i18n-title="btnRelatorioTitulo"></button>
    <button class="btn-barra" id="btnHistorico" data-i18n="btnHistorico" data-i18n-title="btnHistoricoTitulo"></button>
  </div>

  <div class="grid" id="grid"></div>
</div>

<!-- Nome do usuário (obrigatório na primeira visita) -->

let idioma = 'ja';
function t(chave, vars){
  let texto = (TXT[idioma] && TXT[idioma][chave]);
  if(texto === undefined) texto = TXT.pt[chave];
  if(texto === undefined) return chave;
  if(vars) Object.keys(vars).forEach(k => { texto = texto.split('{' + k + '}').join(vars[k]); });
  return texto;
}
function loc(){ return idioma === 'ja' ? 'ja-JP' : 'pt-BR'; }

function esc(s){
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

// Nome de um produto vindo da planilha (traz o nome em português e, às vezes, o japonês)
function nomesDe(ptNome, jpNome){
  const pt = ptNome || '';
  const jp = jpNome || (produtoPorNomePt[pt] ? produtoPorNomePt[pt].nomeJp : '');
  if(idioma === 'ja') return { principal: jp || pt, secundario: jp ? pt : '' };
  return { principal: pt || jp, secundario: pt ? jp : '' };
}
function rotuloProduto(ptNome, jpNome){
  const n = nomesDe(ptNome, jpNome);
  return n.secundario ? `${n.principal}（${n.secundario}）` : n.principal;
}

function urlConfigurada(){ return CONFIG.scriptUrl.indexOf('COLE_AQUI') === -1; }

async function buscarJson(tipo, extra){
  if(!urlConfigurada()) throw new Error('scriptUrl não configurada');
  const resposta = await fetch(CONFIG.scriptUrl + '?tipo=' + tipo + (extra || ''), { cache:'no-store' });
  const dados = await resposta.json();
  if(!Array.isArray(dados)) throw new Error((dados && dados.erro) || 'resposta inesperada');
  return dados;
}

  dados.usuario = obterUsuario();

    // Apps Script não devolve cabeçalho CORS em POST, então usamos no-cors
    // (não conseguimos ler a resposta, mas o envio funciona normalmente)
    await fetch(CONFIG.scriptUrl, {
      method:'POST',
      mode:'no-cors',
      headers:{ 'Content-Type':'text/plain' },
      body: JSON.stringify(dados)
    });
  }catch(erro){
    console.error(erro);
  }
}

/* =========================================================================
   SINCRONIZAÇÃO DO ESTOQUE
   ========================================================================= */
function aplicarNivelEstoque(linha, quantidade){
  linha.classList.remove('sem-estoque', 'estoque-baixo', 'estoque-ok');
  if(quantidade <= 0){
    linha.classList.add('sem-estoque');
  }else if(quantidade <= CONFIG.estoqueBaixo){
    linha.classList.add('estoque-baixo');
  }else{
    linha.classList.add('estoque-ok');
  }
}

function definirStatus(chave, tipo, vars){
  estadoStatus = { chave, tipo: tipo || '', vars: vars || null };
  renderStatus();
}
function renderStatus(){
  const vars = estadoStatus.vars ? Object.assign({}, estadoStatus.vars) : null;
  if(vars && vars.hora) vars.h = new Date(vars.hora).toLocaleTimeString(loc());
  $('textoStatus').textContent = t(estadoStatus.chave, vars);
  $('pontoStatus').className = 'ponto' + (estadoStatus.tipo === 'ok' ? ' ok' : estadoStatus.tipo === 'erro' ? ' erro' : '');
}

async function carregarEstoqueAtual(silencioso){
  if(!urlConfigurada()){
    definirStatus('configurarUrl', 'erro');
    return;
  }
  if(sincronizando) return;
  sincronizando = true;
  if(!silencioso) definirStatus('sincronizando');

  try{
    const dados = await buscarJson('estoque');
    const totais = {};
    dados.forEach(item => {
      estoqueMap[item.id] = item.quantidade;
      const linha = document.querySelector(`.linha-tamanho[data-id="${item.id}"]`);
      if(linha){
        linha.querySelector('.valor-estoque').textContent = item.quantidade;
        aplicarNivelEstoque(linha, item.quantidade);
      }
      const prodId = item.id.split('_')[0];
      totais[prodId] = (totais[prodId] || 0) + item.quantidade;
    });
    Object.keys(totais).forEach(prodId => {
      const el = document.querySelector(`[data-total="${prodId}"]`);
      if(el){ el.dataset.n = totais[prodId]; el.textContent = t('unidades', { n: totais[prodId] }); }
    });
    definirStatus('sincronizadoAs', 'ok', { hora: Date.now() });
  }catch(erro){
    console.error(erro);
    definirStatus('falhaConexao', 'erro');
  }finally{
    sincronizando = false;
  }
}

/* =========================================================================
   AJUSTE DE ESTOQUE (+ / − / valor exato)
   ========================================================================= */
async function alterarEstoque(prod, tamanho, acao, quantidade, linha){
  const id = prod.id + '_' + tamanho;
  const valorEl = linha.querySelector('.valor-estoque');
  const botoes = linha.querySelectorAll('.btn-passo');
  botoes.forEach(b => b.disabled = true);

  const atual = parseInt(valorEl.textContent, 10) || 0;
  const novoValorOtimista = acao === 'adicionar' ? atual + quantidade : Math.max(0, atual - quantidade);
  valorEl.textContent = novoValorOtimista;
  estoqueMap[id] = novoValorOtimista;
  aplicarNivelEstoque(linha, novoValorOtimista);

  await enviarAlteracao({ action: acao, id, produto: prod.nome, produtoJp: prod.nomeJp, tamanho, quantidade });
  botoes.forEach(b => b.disabled = false);
}

function editarValorExato(prod, tamanho, linha){
  const valorEl = linha.querySelector('.valor-estoque');
  const input = document.createElement('input');
  input.type = 'number';
  input.min = '0';
  input.value = valorEl.textContent;
  valorEl.replaceWith(input);
  input.focus();
  input.select();

  let concluido = false; // o navegador pode disparar "blur" mais de uma vez
  const confirmar = async () => {
    if(concluido) return;
    concluido = true;
    const novo = Math.max(0, parseInt(input.value, 10) || 0);
    const novoSpan = document.createElement('span');
    novoSpan.className = 'valor-estoque';
    novoSpan.dataset.i18nTitle = 'tituloValorExato';
    novoSpan.title = t('tituloValorExato');
    novoSpan.textContent = novo;
    input.replaceWith(novoSpan);
    novoSpan.addEventListener('click', () => editarValorExato(prod, tamanho, linha));
    const id = prod.id + '_' + tamanho;
    estoqueMap[id] = novo;
    aplicarNivelEstoque(linha, novo);

    await enviarAlteracao({ action:'definir', id, produto: prod.nome, produtoJp: prod.nomeJp, tamanho, quantidade: novo });
  };
  input.addEventListener('blur', confirmar);
  input.addEventListener('keydown', e => { if(e.key === 'Enter') input.blur(); });
}

async function enviarAlteracao(dados){
  await postar(dados);
  setTimeout(() => carregarEstoqueAtual(true), 1200);
}

// Junta as linhas da planilha em pedidos (cada pedido tem uma lista de itens)
function agruparPedidos(linhas){
  const mapa = new Map();
  linhas.forEach(it => {
    const chave = it.pedidoId || it.id; // pedido antigo, sem PedidoID: vale como pedido de um item só
    if(!mapa.has(chave)){
      mapa.set(chave, {
        pedidoId: chave, funcionario: it.funcionario, solicitante: it.solicitante,
        dataSolicitacao: it.dataSolicitacao, itens: []
      });
    }
    mapa.get(chave).itens.push(it);
  });
  const pedidos = Array.from(mapa.values());
  pedidos.forEach(p => p.itens.reverse()); // a planilha vem do mais novo para o mais antigo
  return pedidos;
}

async function carregarPedidos(){
  try{
    estadoPedidos = { estado:'ok', itens: await buscarJson('solicitacoes') };
  }catch(erro){
    console.error(erro);
    estadoPedidos = { estado:'erro', itens:[] };
  }
  renderPedidos();
}

function renderPedidos(){
  const lista = $('listaPedidos');
  const badge = $('badgePendentes');
  if(estadoPedidos.estado === 'carregando'){ lista.textContent = t('carregando'); return; }
  if(estadoPedidos.estado === 'erro'){ lista.textContent = t('pedErro'); return; }

  const pedidos = agruparPedidos(estadoPedidos.itens);
  const abertos = pedidos.filter(p => p.itens.some(i => i.status === 'Pendente'));
  const resolvidos = pedidos.filter(p => !p.itens.some(i => i.status === 'Pendente')).slice(0, 10);

  if(abertos.length > 0){ badge.textContent = abertos.length; badge.style.display = 'inline-block'; }
  else { badge.style.display = 'none'; }

  const rolagem = lista.scrollTop;
  lista.innerHTML = '';
  if(pedidos.length === 0){ lista.textContent = t('pedVazio'); return; }

  abertos.forEach(p => lista.appendChild(criarCartaoPedido(p)));
  if(resolvidos.length > 0){
    const titulo = document.createElement('div');
    titulo.className = 'subtitulo-lista';
    titulo.textContent = t('pedResolvidos');
    lista.appendChild(titulo);
    resolvidos.forEach(p => lista.appendChild(criarCartaoPedido(p)));
  }
  lista.scrollTop = rolagem;
}

function botoesDeStatus(){
  return `
    <button class="btn-atendido" data-status="Atendido" title="${esc(t('tituloAtendido'))}">${esc(t('btnAtendido'))}</button>
    <button class="btn-fabrica" data-status="Pedido à fábrica" title="${esc(t('tituloFabrica'))}">${esc(t('btnFabrica'))}</button>
    <button class="btn-cancelar-pedido" data-status="Cancelado" title="${esc(t('tituloCancelarPedido'))}">${esc(t('btnCancelarPedido'))}</button>`;
}

function criarCartaoPedido(pedido){
  const pendentes = pedido.itens.filter(i => i.status === 'Pendente');
  const div = document.createElement('div');
  div.className = 'pedido';
  div.dataset.pedido = pedido.pedidoId;

  div.innerHTML = `
    <div class="pedido-cabecalho">
      <div class="pedido-funcionario">👤 ${esc(pedido.funcionario)}</div>
      <div class="pedido-sub">${esc(t('solicitante'))}: ${esc(pedido.solicitante)} — ${esc(dataHoraLocal(pedido.dataSolicitacao))}</div>
      ${pendentes.length > 1 ? `<div class="pedido-em-lote"><span class="rotulo-lote">${esc(t('loteRotulo'))}</span>${botoesDeStatus()}</div>` : ''}
    </div>`;

  pedido.itens.forEach(item => {
    const linha = document.createElement('div');
    linha.className = 'pedido-item';
    linha.innerHTML = `
      <div class="pedido-item-topo">
        <div class="pedido-item-nome">${esc(rotuloProduto(item.produto, item.produtoJp))} ・ ${esc(item.tamanho)} × ${esc(item.quantidade)}</div>
        <span class="status-badge ${classeStatus(item.status)}">${esc(textoStatus(item.status))}</span>
      </div>
      ${item.status === 'Pendente' ? `<div class="pedido-acoes">${botoesDeStatus()}</div>` : ''}`;
    if(item.status === 'Pendente'){
      linha.querySelectorAll('.pedido-acoes button').forEach(b => {
        b.addEventListener('click', () => atualizarStatusPedido({ itens:[item], id:item.id }, b.dataset.status, div));
      });
    }
    div.appendChild(linha);
  });

  div.querySelectorAll('.pedido-em-lote button').forEach(b => {
    b.addEventListener('click', () => atualizarStatusPedido({ itens:pendentes, pedidoId:pedido.pedidoId }, b.dataset.status, div));
  });
  return div;
}

// Itens cujo pedido é maior do que o que há em estoque agora
function itensSemEstoque(itens){
  const necessario = {};
  itens.forEach(i => { const k = i.produtoId + '_' + i.tamanho; necessario[k] = (necessario[k] || 0) + i.quantidade; });
  const faltas = [];
  Object.keys(necessario).forEach(k => {
    if(estoqueMap[k] === undefined) return; // estoque ainda não carregado: não dá para avisar
    if(estoqueMap[k] < necessario[k]){
      const item = itens.find(i => (i.produtoId + '_' + i.tamanho) === k);
      faltas.push(t('linhaFalta', { nome: rotuloProduto(item.produto, item.produtoJp), tam: item.tamanho, estoque: estoqueMap[k], qtd: necessario[k] }));
    }
  });
  return faltas;
}

async function atualizarStatusPedido(alvo, novoStatus, cartao){
  if(novoStatus === 'Atendido'){
    const faltas = itensSemEstoque(alvo.itens);
    if(faltas.length > 0 && !window.confirm(t('confirmaSemEstoque', { lista: faltas.join('\n') }))) return;
  }
  cartao.querySelectorAll('button').forEach(b => { b.disabled = true; });

  if(alvo.pedidoId) await postar({ action:'atualizarPedido', pedidoId: alvo.pedidoId, novoStatus });
  else await postar({ action:'atualizarSolicitacao', id: alvo.id, novoStatus });

  setTimeout(() => {
    carregarPedidos();
    if(novoStatus === 'Atendido') carregarEstoqueAtual(true);
  }, 1200);
}

/* =========================================================================
   RELATÓRIO DE MOVIMENTAÇÃO (por mês / por ano)
   ========================================================================= */
function opcoesAnos(){
  const atual = new Date().getFullYear();
  const inicio = Math.min(2026, atual);
  const anos = [];
  for(let a = atual; a >= inicio; a--) anos.push(a);
  return anos;
}
function nomeDoMes(m){
  return new Date(2000, m - 1, 1).toLocaleString(loc(), { month:'long' });
}

function abrirRelatorio(){
  const agora = new Date();
  if(!relatorio.ano){ relatorio.ano = agora.getFullYear(); relatorio.mes = agora.getMonth() + 1; }
  relatorio.aberto = true;
  $('modalRelatorio').classList.add('aberto');
  $('fundoEscurecido').classList.add('ativo');
  carregarMovimentos();
}
function fecharRelatorio(){
  relatorio.aberto = false;
  $('modalRelatorio').classList.remove('aberto');
  $('fundoEscurecido').classList.remove('ativo');
}

async function carregarMovimentos(){
  const ano = relatorio.ano;
  relatorio.carregando = true;
  relatorio.erro = false;
  renderRelatorio();
  try{
    const dados = await buscarJson('movimentos', '&ano=' + ano);
    // um Apps Script antigo devolve a lista do estoque no lugar dos movimentos
    if(dados.some(m => typeof m.delta !== 'number' || typeof m.mes !== 'number')) throw new Error('resposta de versão antiga');
    if(ano !== relatorio.ano) return; // a pessoa já trocou de ano: ignora esta resposta
    relatorio.dados = dados;
  }catch(erro){
    console.error(erro);
    if(ano !== relatorio.ano) return;
    relatorio.dados = [];
    relatorio.erro = true;
  }
  relatorio.carregando = false;
  renderRelatorio();
}

function movimentosFiltrados(incluirMes){
  return relatorio.dados.filter(m =>
    (!incluirMes || relatorio.modo === 'anual' || m.mes === relatorio.mes) &&
    (relatorio.usuario === 'todos' || m.usuario === relatorio.usuario));
}

function ordemProduto(nomePt){
  const i = produtos.findIndex(p => p.nome === nomePt);
  return i === -1 ? 999 : i;
}
function ordemTamanho(nomePt, tam){
  const p = produtoPorNomePt[nomePt];
  const i = p ? p.tamanhos.indexOf(tam) : -1;
  return i === -1 ? 999 : i;
}

function resumirMovimentos(lista){
  let entradas = 0, saidas = 0;
  const porProduto = {};
  lista.forEach(m => {
    const entrou = m.delta > 0 ? m.delta : 0;
    const saiu = m.delta < 0 ? -m.delta : 0;
    entradas += entrou; saidas += saiu;
    const p = porProduto[m.produto] || (porProduto[m.produto] = { nome:m.produto, entradas:0, saidas:0, tamanhos:{} });
    p.entradas += entrou; p.saidas += saiu;
    const tm = p.tamanhos[m.tamanho] || (p.tamanhos[m.tamanho] = { entradas:0, saidas:0 });
    tm.entradas += entrou; tm.saidas += saiu;
  });
  const produtosOrdenados = Object.keys(porProduto)
    .sort((a, b) => ordemProduto(a) - ordemProduto(b) || a.localeCompare(b))
    .map(k => porProduto[k]);
  return { entradas, saidas, saldo: entradas - saidas, total: lista.length, produtos: produtosOrdenados };
}

function sinal(n){ return n > 0 ? '+' + n : n < 0 ? '−' + Math.abs(n) : '0'; }
function classeSinal(n){ return n > 0 ? 'pos' : n < 0 ? 'neg' : 'neutro'; }

function formatarDataHoraRelatorio(texto){
  const m = /^(\d{4})-(\d{2})-(\d{2}) (\d{2}):(\d{2})/.exec(texto || '');
  if(!m) return texto || '';
  return idioma === 'ja' ? `${m[1]}/${m[2]}/${m[3]} ${m[4]}:${m[5]}` : `${m[3]}/${m[2]}/${m[1]} ${m[4]}:${m[5]}`;
}

function rotuloTipo(m){
  if(m.acao === 'definir') return t('tipoAjuste');
  return m.delta > 0 ? t('tipoEntrada') : t('tipoSaida');
}

function renderRelatorio(){
  const r = relatorio;
  $('relModoMensal').classList.toggle('ativo', r.modo === 'mensal');
  $('relModoAnual').classList.toggle('ativo', r.modo === 'anual');
  $('relGrupoMes').classList.toggle('oculto', r.modo !== 'mensal');

  $('relAno').innerHTML = opcoesAnos().map(a => `<option value="${a}"${a === r.ano ? ' selected' : ''}>${a}</option>`).join('');
  let optMes = '';
  for(let m = 1; m <= 12; m++) optMes += `<option value="${m}"${m === r.mes ? ' selected' : ''}>${esc(nomeDoMes(m))}</option>`;
  $('relMes').innerHTML = optMes;

  const usuarios = Array.from(new Set(r.dados.map(m => m.usuario))).sort((a, b) => a.localeCompare(b, loc()));
  if(r.usuario !== 'todos' && usuarios.indexOf(r.usuario) === -1) r.usuario = 'todos';
  $('relUsuario').innerHTML = `<option value="todos">${esc(t('relTodos'))}</option>` +
    usuarios.map(u => `<option value="${esc(u)}"${u === r.usuario ? ' selected' : ''}>${esc(u)}</option>`).join('');

  const corpo = $('relCorpo');
  if(r.carregando){ corpo.textContent = t('carregando'); return; }
  if(r.erro){ corpo.innerHTML = `<div class="rel-vazio">${esc(t('relErro'))}</div>`; return; }

  const periodo = movimentosFiltrados(true);
  const resumo = resumirMovimentos(periodo);

  let html = `
    <div class="rel-cards">
      <div class="rel-card"><div class="rotulo">${esc(t('relEntradas'))}</div><div class="numero pos">${sinal(resumo.entradas)}</div></div>
      <div class="rel-card"><div class="rotulo">${esc(t('relSaidas'))}</div><div class="numero neg">${resumo.saidas ? '−' + resumo.saidas : '0'}</div></div>
      <div class="rel-card"><div class="rotulo">${esc(t('relSaldo'))}</div><div class="numero ${classeSinal(resumo.saldo)}">${sinal(resumo.saldo)}</div><div class="sub">${esc(t('relMovimentos', { n: resumo.total }))}</div></div>
    </div>`;

  if(r.modo === 'anual'){
    const doAno = movimentosFiltrados(false);
    const meses = [];
    for(let m = 1; m <= 12; m++) meses.push({ entradas:0, saidas:0 });
    doAno.forEach(mv => {
      if(mv.mes >= 1 && mv.mes <= 12){
        if(mv.delta > 0) meses[mv.mes - 1].entradas += mv.delta; else meses[mv.mes - 1].saidas += -mv.delta;
      }
    });
    html += `<div class="rel-secao">${esc(t('relPorMes'))}</div><div class="rel-rolagem"><table class="rel-tabela">
      <thead><tr><th>${esc(t('relColMes'))}</th><th class="num">${esc(t('relEntradas'))}</th><th class="num">${esc(t('relSaidas'))}</th><th class="num">${esc(t('relSaldo'))}</th></tr></thead><tbody>`;
    meses.forEach((x, i) => {
      const saldo = x.entradas - x.saidas;
      html += `<tr><td>${esc(nomeDoMes(i + 1))}</td><td class="num pos">${x.entradas ? '+' + x.entradas : '0'}</td><td class="num neg">${x.saidas ? '−' + x.saidas : '0'}</td><td class="num ${classeSinal(saldo)}">${sinal(saldo)}</td></tr>`;
    });
    html += `<tr class="linha-total"><td>${esc(t('relTotal'))}</td><td class="num pos">${sinal(resumo.entradas)}</td><td class="num neg">${resumo.saidas ? '−' + resumo.saidas : '0'}</td><td class="num ${classeSinal(resumo.saldo)}">${sinal(resumo.saldo)}</td></tr>`;
    html += `</tbody></table></div>`;
  }

  if(resumo.total === 0){
    html += `<div class="rel-vazio">${esc(t('relVazio'))}</div>`;
  }else{
    html += `<div class="rel-secao">${esc(t('relPorProduto'))}</div><div class="rel-rolagem"><table class="rel-tabela">
      <thead><tr><th>${esc(t('relColProduto'))}</th><th class="num">${esc(t('relEntradas'))}</th><th class="num">${esc(t('relSaidas'))}</th><th class="num">${esc(t('relSaldo'))}</th></tr></thead><tbody>`;
    resumo.produtos.forEach(p => {
      const saldo = p.entradas - p.saidas;
      html += `<tr class="linha-produto"><td>${esc(rotuloProduto(p.nome))}</td><td class="num pos">${p.entradas ? '+' + p.entradas : '0'}</td><td class="num neg">${p.saidas ? '−' + p.saidas : '0'}</td><td class="num ${classeSinal(saldo)}">${sinal(saldo)}</td></tr>`;
      Object.keys(p.tamanhos).sort((a, b) => ordemTamanho(p.nome, a) - ordemTamanho(p.nome, b)).forEach(tam => {
        const x = p.tamanhos[tam], s = x.entradas - x.saidas;
        html += `<tr class="linha-tam"><td>${esc(t('tamAbrev'))} ${esc(tam)}</td><td class="num">${x.entradas ? '+' + x.entradas : '0'}</td><td class="num">${x.saidas ? '−' + x.saidas : '0'}</td><td class="num">${sinal(s)}</td></tr>`;
      });
    });
    html += `</tbody></table></div>`;

    const detalhe = periodo.slice().sort((a, b) => a.dataHora < b.dataHora ? 1 : a.dataHora > b.dataHora ? -1 : 0);
    const mostrados = detalhe.slice(0, CONFIG.limiteDetalheRelatorio);
    html += `<div class="rel-secao">${esc(t('relDetalhe'))}</div><div class="rel-rolagem"><table class="rel-tabela">
      <thead><tr><th>${esc(t('relColQuando'))}</th><th>${esc(t('relColQuem'))}</th><th>${esc(t('relColProduto'))}</th><th>${esc(t('relColTam'))}</th><th>${esc(t('relColTipo'))}</th><th class="num">${esc(t('relColQtd'))}</th><th>${esc(t('relColPara'))}</th></tr></thead><tbody>`;
    mostrados.forEach(m => {
      html += `<tr><td>${esc(formatarDataHoraRelatorio(m.dataHora))}</td><td>${esc(m.usuario)}</td><td>${esc(rotuloProduto(m.produto))}</td><td>${esc(m.tamanho)}</td><td>${esc(rotuloTipo(m))}</td><td class="num ${classeSinal(m.delta)}">${sinal(m.delta)}</td><td>${m.funcionario ? '👤 ' + esc(m.funcionario) : '—'}</td></tr>`;
    });
    html += `</tbody></table></div>`;
    if(detalhe.length > mostrados.length) html += `<p class="rel-nota">${esc(t('relLimite', { n: mostrados.length }))}</p>`;
  }

  html += `<p class="rel-nota">${esc(t('relNota'))}</p>`;
  corpo.innerHTML = html;
}

// CSV para abrir no Excel / Google Sheets (UTF-8 com BOM para o japonês aparecer certo)
function celulaCsv(valor, texto){
  let s = String(valor == null ? '' : valor);
  if(texto && /^[=+\-@\t\r]/.test(s)) s = "'" + s; // evita que o Excel trate texto como fórmula
  return '"' + s.replace(/"/g, '""') + '"';
}
function montarCsv(lista){
  const ordenada = lista.slice().sort((a, b) => a.dataHora < b.dataHora ? 1 : a.dataHora > b.dataHora ? -1 : 0);
  const cabecalho = [t('relColQuando'), t('relColQuem'), t('relColProduto'), 'ProdutoJP', t('relColTam'), t('relColTipo'), t('relColQtd'), t('relColPara'), t('relColAntes'), t('relColDepois')];
  const linhas = [cabecalho.map(c => celulaCsv(c)).join(',')];
  ordenada.forEach(m => {
    const jp = produtoPorNomePt[m.produto] ? produtoPorNomePt[m.produto].nomeJp : '';
    linhas.push([
      celulaCsv(m.dataHora), celulaCsv(m.usuario, true), celulaCsv(m.produto, true), celulaCsv(jp, true),
      celulaCsv(m.tamanho, true), celulaCsv(rotuloTipo(m)), celulaCsv(m.delta),
      celulaCsv(m.funcionario, true), celulaCsv(m.quantidadeAnterior), celulaCsv(m.quantidadeNova)
    ].join(','));
  });
  return '﻿' + linhas.join('\r\n');
}
function exportarCsv(){
  const lista = movimentosFiltrados(true);
  const blob = new Blob([montarCsv(lista)], { type:'text/csv;charset=utf-8' });
  const periodo = relatorio.modo === 'mensal' ? relatorio.ano + '-' + String(relatorio.mes).padStart(2, '0') : String(relatorio.ano);
  const link = document.createElement('a');
  link.href = URL.createObjectURL(blob);
  link.download = 'estoque-movimentos-' + periodo + '.csv';
  document.body.appendChild(link);
  link.click();
  link.remove();
  setTimeout(() => URL.revokeObjectURL(link.href), 2000);
}

/* =========================================================================
   INICIALIZAÇÃO
   ========================================================================= */
function fecharTudo(){
  $('painelHistorico').classList.remove('aberto');
  $('painelPedidos').classList.remove('aberto');
  if(relatorio.aberto) relatorio.aberto = false;
  $('modalRelatorio').classList.remove('aberto');
  $('modalSolicitar').classList.remove('aberto');
  $('fundoEscurecido').classList.remove('ativo');
}

function iniciar(){
  let idiomaSalvo = 'ja';
  try{ idiomaSalvo = localStorage.getItem('estoqueUniformesIdioma') || 'ja'; }catch(e){}

  montarAbas();
  montarCards();
  iniciarSeletorModo();
  aplicarIdioma(idiomaSalvo);
  definirStatus('carregando');

  $('seletorIdioma').addEventListener('click', e => {
    const btn = e.target.closest('button');
    if(btn) aplicarIdioma(btn.dataset.idioma);
  });
  $('btnTrocarNome').addEventListener('click', () => abrirModalNome(false, obterUsuario()));
  $('busca').addEventListener('input', aplicarFiltros);

  $('btnConfirmarNome').addEventListener('click', confirmarNome);
  $('btnCancelarNome').addEventListener('click', fecharModalNome);
  const inputNome = $('inputNomeUsuario');
  inputNome.addEventListener('keydown', e => { if(e.key === 'Enter') confirmarNome(); });
  inputNome.addEventListener('input', () => {
    inputNome.classList.remove('campo-invalido');
    $('erroNomeUsuario').classList.remove('visivel');
  });

  let nomeExistente = null;
  try{ nomeExistente = localStorage.getItem('estoqueUniformesUsuario'); }catch(e){}
  $('nomeUsuarioAtual').textContent = nomeExistente || '—';
  if(!nomeExistente){
    // Obrigatório: sem botão de cancelar, a caixa fica aberta até digitar algo
    abrirModalNome(true, '');
  }

  // histórico
  $('btnHistorico').addEventListener('click', () => {
    $('painelHistorico').classList.add('aberto');
    $('fundoEscurecido').classList.add('ativo');
    carregarHistorico();
  });
  $('fecharHistorico').addEventListener('click', fecharTudo);

  // pedido com vários itens
  $('btnSolicitar').addEventListener('click', abrirModalSolicitar);
  $('btnCancelarSolicitar').addEventListener('click', fecharModalSolicitar);
  $('btnEnviarSolicitar').addEventListener('click', enviarSolicitacao);
  $('btnAdicionarItem').addEventListener('click', () => {
    itensSolicitar.push(novoItemSolicitar());
    renderItensSolicitar();
    const caixas = document.querySelectorAll('#listaItensSolicitar .linha-item-solicitar');
    if(caixas.length) caixas[caixas.length - 1].scrollIntoView({ block:'nearest' });
  });

  // lista de pedidos
  $('btnPendentes').addEventListener('click', abrirPainelPedidos);
  $('fecharPedidos').addEventListener('click', fecharPainelPedidos);

  // relatório
  $('btnRelatorio').addEventListener('click', abrirRelatorio);
  $('fecharRelatorio').addEventListener('click', fecharRelatorio);
  $('relModoMensal').addEventListener('click', () => { relatorio.modo = 'mensal'; renderRelatorio(); });
  $('relModoAnual').addEventListener('click', () => { relatorio.modo = 'anual'; renderRelatorio(); });
  $('relAno').addEventListener('change', e => { relatorio.ano = parseInt(e.target.value, 10); carregarMovimentos(); });
  $('relMes').addEventListener('change', e => { relatorio.mes = parseInt(e.target.value, 10); renderRelatorio(); });
  $('relUsuario').addEventListener('change', e => { relatorio.usuario = e.target.value; renderRelatorio(); });
  $('btnCsv').addEventListener('click', exportarCsv);

  // clicar fora fecha os painéis, mas NÃO o pedido em preenchimento (para não perder a lista digitada)
  $('fundoEscurecido').addEventListener('click', () => {
    if($('modalSolicitar').classList.contains('aberto')) return;
    fecharTudo();
  });
  document.addEventListener('keydown', e => {
    if(e.key !== 'Escape') return;
    if($('modalNome').classList.contains('aberto') && $('btnCancelarNome').style.display === 'none') return;
    if($('modalNome').classList.contains('aberto')) { fecharModalNome(); return; }
    if($('modalSolicitar').classList.contains('aberto')) { fecharModalSolicitar(); return; }
    fecharTudo();
  });

  verificarVersaoBackend();
  carregarEstoqueAtual();
  carregarPedidos();
  setInterval(() => {
    carregarEstoqueAtual(true);
    carregarPedidos();
  }, CONFIG.intervaloAtualizacaoMs);
}

document.addEventListener('DOMContentLoaded', iniciar);
</script>
